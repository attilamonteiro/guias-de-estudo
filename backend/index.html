<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Guia de Backend</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: trilho de índice à esquerda (30 "requisições"), coluna de leitura à direita; cada pergunta lê-se como uma entrada de log anotada. */
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#e9edf1; --fg:#14202b; --muted:#566570; --line:#d3dae1;
  --accent:#0b6b6b; --accent-fg:#ffffff; --accent-soft:#d6ecec;
  --warn:#8f4705; --warn-soft:#fbeed6; --good:#17753a; --good-soft:#dcf1e3;
  --code-bg:#0e1a23; --code-fg:#d5e3ee; --code-mute:#7f95a6;
  --c-feynman:#2563eb; --c-whys:#c2410c; --c-compare:#0f766e; --c-trace:#7c3aed;
  --c-playbook:#4d7c0f; --c-threat:#c81e1e; --c-firstprinciples:#a16207; --c-design:#be185d;
  --r:6px; --hh:57px;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c141b; --surface:#131e27; --surface-2:#1b2935; --fg:#e4edf3; --muted:#9bb0bf; --line:#263643;
    --accent:#4fd1c5; --accent-fg:#06201f; --accent-soft:#12302f;
    --warn:#f5b45c; --warn-soft:#2c2112; --good:#6fd68f; --good-soft:#12291a;
    --code-bg:#080f14; --code-fg:#d5e3ee; --code-mute:#7f95a6;
    --c-feynman:#7fb0ff; --c-whys:#fb9a5a; --c-compare:#3dd6c4; --c-trace:#b79cff;
    --c-playbook:#a6e04f; --c-threat:#ff8484; --c-firstprinciples:#f0c24a; --c-design:#f58ab9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c141b; --surface:#131e27; --surface-2:#1b2935; --fg:#e4edf3; --muted:#9bb0bf; --line:#263643;
  --accent:#4fd1c5; --accent-fg:#06201f; --accent-soft:#12302f;
  --warn:#f5b45c; --warn-soft:#2c2112; --good:#6fd68f; --good-soft:#12291a;
  --code-bg:#080f14; --code-fg:#d5e3ee; --code-mute:#7f95a6;
  --c-feynman:#7fb0ff; --c-whys:#fb9a5a; --c-compare:#3dd6c4; --c-trace:#b79cff;
  --c-playbook:#a6e04f; --c-threat:#ff8484; --c-firstprinciples:#f0c24a; --c-design:#f58ab9;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--hh) + 12px)}
body{background:var(--bg);color:var(--fg);font:16px/1.65 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:inherit}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:.08em .35em;border-radius:4px}
strong{font-weight:600}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.18;text-wrap:balance;margin:0}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- topo ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:-.01em;margin-right:auto}
.brand-mark{font-family:var(--f-mono);font-weight:500;font-size:.78rem;background:var(--accent);color:var(--accent-fg);padding:3px 7px;border-radius:var(--r)}
.tabs{display:flex;gap:2px}
.tabs a{text-decoration:none;font-size:.9rem;padding:7px 11px;border-radius:var(--r);color:var(--muted);font-weight:500}
.tabs a:hover{background:var(--surface-2);color:var(--fg)}
.tabs a[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 11px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.bar{width:74px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:var(--r);text-decoration:none;font-size:.92rem;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--fg)}
.btn[disabled]{opacity:.45;cursor:default}
.only-m{display:none}

/* ---------- estrutura ---------- */
.app{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(250px,310px) minmax(0,1fr);align-items:start}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));max-height:calc(100vh - var(--hh) - env(safe-area-inset-top,0px));overflow:auto;padding:18px 18px 40px 0;border-right:1px solid var(--line)}
#search{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg);font:inherit;font-size:.92rem;margin-bottom:12px}
.grp{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.ni{display:grid;grid-template-columns:30px 1fr 16px;align-items:center;gap:6px;padding:6px 8px;border-radius:var(--r);text-decoration:none;font-size:.92rem;line-height:1.35}
.ni:hover{background:var(--surface-2)}
.ni[aria-current="page"]{background:var(--accent-soft);font-weight:600}
.ni .num{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.ni .ck{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line)}
.ni.done .ck{background:var(--good);border-color:var(--good)}
.ni.review .ck{border-color:var(--warn);background:var(--warn-soft)}
main{min-width:0;padding:28px 0 90px 34px;outline:0}

/* ---------- marcadores de método ---------- */
.mk-feynman{--m:var(--c-feynman)}.mk-whys{--m:var(--c-whys)}.mk-compare{--m:var(--c-compare)}.mk-trace{--m:var(--c-trace)}
.mk-playbook{--m:var(--c-playbook)}.mk-threat{--m:var(--c-threat)}.mk-firstprinciples{--m:var(--c-firstprinciples)}.mk-design{--m:var(--c-design)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;padding:3px 10px 3px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--m) 45%,var(--line));background:color-mix(in srgb,var(--m) 12%,var(--surface));white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--m)}

/* ---------- home ---------- */
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(2rem,5vw,3.1rem);letter-spacing:-.02em;margin:10px 0 14px;font-weight:700}
.lead{font-size:1.1rem;max-width:62ch;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.sec{margin-top:46px}
.sec>h2{font-size:1.5rem;margin-bottom:14px;letter-spacing:-.01em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;list-style:none;margin:0;padding:0;counter-reset:h}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;counter-increment:h}
.how li::before{content:counter(h);font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:500}
.how strong{display:block;margin:2px 0 4px;font-family:var(--f-display)}
.how span{font-size:.92rem;color:var(--muted);display:block}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard h3{font-size:1.08rem}
.mcard p{font-size:.92rem;color:var(--muted)}
.mcard .flow-s{font-family:var(--f-mono);font-size:.76rem;color:var(--fg);line-height:1.7}
.mcard .qn{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.qn a{font-family:var(--f-mono);font-size:.76rem;text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--surface-2)}
.qn a:hover{border-color:var(--accent)}
.mod{margin-top:22px}
.mod h3{font-size:1.1rem;margin-bottom:10px}
.mod h3 span{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-weight:500;margin-right:8px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.qc{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-decoration:none;min-width:0}
.qc:hover{border-color:var(--accent)}
.qc .top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qc .num{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.qc b{font-family:var(--f-display);font-weight:600;line-height:1.25}
.qc.done{background:color-mix(in srgb,var(--good) 8%,var(--surface))}

/* ---------- pergunta ---------- */
.q{max-width:860px}
.q-head h1{font-size:clamp(1.55rem,3.4vw,2.2rem);letter-spacing:-.015em;margin:8px 0 16px;font-weight:700}
.mrow{display:flex;gap:10px 14px;align-items:flex-start;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.mrow p{flex:1 1 320px;font-size:.92rem;color:var(--muted);min-width:0}
.lbl{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.one{margin-top:18px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:var(--r);padding:16px 18px}
.one p{font-size:1.04rem;max-width:72ch}
.qs{margin-top:34px}
.qs>h2{font-size:1.18rem;margin-bottom:12px}
h4{font-size:1rem;margin:18px 0 8px}
.an{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.an>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;font-size:.96rem}
.an>div.simple{background:color-mix(in srgb,var(--c-feynman) 9%,var(--surface))}
.an>div.break{background:var(--warn-soft)}
.whys{list-style:none;margin:0;padding:0;display:grid;gap:0}
.whys li{position:relative;padding:0 0 16px 44px}
.whys li::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.whys li:last-child::before{display:none}
.w-n{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--c-whys);color:var(--bg);font-family:var(--f-mono);font-weight:500;display:grid;place-items:center;font-size:.85rem}
.w-q{font-family:var(--f-display);font-weight:600;font-size:1.04rem;line-height:1.3;padding-top:3px}
.w-a{margin-top:4px;color:var(--fg);font-size:.97rem;max-width:68ch}
.root{background:var(--surface);border:1px solid var(--c-whys);border-radius:var(--r);padding:14px 16px;margin-top:4px}
.tbw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:520px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
thead th{background:var(--surface-2);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
tbody th{font-weight:600;width:22%;background:color-mix(in srgb,var(--surface-2) 45%,var(--surface))}
tbody tr:last-child>*{border-bottom:0}
td{min-width:150px}
.note{font-size:.88rem;color:var(--muted);margin-top:8px;max-width:72ch}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.s-n{width:28px;height:28px;border-radius:var(--r);background:var(--surface-2);font-family:var(--f-mono);font-size:.82rem;display:grid;place-items:center;color:var(--accent);font-weight:500}
.steps strong{font-family:var(--f-display);font-size:1rem}
.steps p{font-size:.94rem;margin-top:3px;max-width:68ch}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.node{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:.9rem;flex:1 1 200px;max-width:100%;min-width:0}
.arr{align-self:center;color:var(--accent);font-family:var(--f-mono);font-size:1.1rem;font-weight:500}
.pairs{display:grid;gap:8px}
.pr-h,.pr{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1.25fr);gap:8px;align-items:stretch}
.pr-h span{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pr-a,.pr-b{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:.92rem;background:var(--surface)}
.pr-a{background:color-mix(in srgb,var(--c-threat) 7%,var(--surface))}
.pr-b{background:color-mix(in srgb,var(--good) 8%,var(--surface))}
.pr .arr{align-self:center;text-align:center}
.code{margin:12px 0 0;background:var(--code-bg);border-radius:var(--r);overflow:hidden}
.code figcaption{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--code-mute);padding:7px 14px;border-bottom:1px solid #ffffff1a}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--f-mono);font-size:.84rem;line-height:1.6;color:var(--code-fg)}
.code code{background:none;padding:0;font-size:inherit}
.code .note{padding:0 14px 12px;color:var(--code-mute);margin:0}
.tp{margin-top:14px;border-radius:var(--r);padding:12px 15px;border:1px solid var(--line);background:var(--surface)}
.tp strong{display:block;font-family:var(--f-display)}
.tp p{font-size:.94rem;max-width:72ch}
.tp-warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.tp-key{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.blk+.blk{margin-top:20px}
.traps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.traps li{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));border-radius:var(--r);padding:10px 14px 10px 40px;position:relative;font-size:.94rem;max-width:76ch}
.traps li::before{content:"!";position:absolute;left:12px;top:9px;width:18px;height:18px;border-radius:50%;background:var(--warn);color:var(--bg);font-weight:700;font-size:.78rem;display:grid;place-items:center;font-family:var(--f-mono)}
details.rc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
details.rc summary{cursor:pointer;padding:11px 14px;font-weight:500;list-style:none;display:flex;gap:10px}
details.rc summary::-webkit-details-marker{display:none}
details.rc summary::before{content:"?";font-family:var(--f-mono);color:var(--accent);font-weight:500}
details.rc[open] summary{border-bottom:1px solid var(--line)}
details.rc p{padding:11px 14px 12px 38px;font-size:.95rem;max-width:72ch}
.teach{background:var(--surface);border:1px dashed var(--accent);border-radius:var(--r);padding:15px 18px}
.teach p{max-width:70ch;font-size:.97rem}
.pn{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}

/* ---------- resumo e treino ---------- */
.cs{display:grid;gap:10px}
.cs-i{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cs-i .num{font-family:var(--f-mono);color:var(--muted);font-size:.84rem;padding-top:2px}
.cs-i .hd{display:flex;gap:8px 12px;flex-wrap:wrap;align-items:center}
.cs-i .hd a{font-family:var(--f-display);font-weight:600;text-decoration:none}
.cs-i .hd a:hover{text-decoration:underline}
.cs-i p{grid-column:2;font-size:.94rem;max-width:74ch}
.drill{max-width:760px}
.drill .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:16px}
.drill .card h2{font-size:1.5rem;letter-spacing:-.01em;margin:10px 0 14px}
.drill .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.drill .ans{margin-top:16px;display:grid;gap:12px}
.empty{background:var(--good-soft);border:1px solid var(--good);border-radius:var(--r);padding:18px}

/* ---------- responsivo ---------- */
@media (max-width:1080px){.an{grid-template-columns:1fr}}
@media (max-width:900px){
  .only-m{display:inline-flex}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:calc(env(safe-area-inset-top,0px) + var(--hh));bottom:0;max-height:none;width:min(350px,90vw);z-index:25;background:var(--surface);padding-left:max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);transform:translateX(-104%);transition:transform .18s ease;visibility:hidden}
  .side.open{transform:none;visibility:visible;box-shadow:0 0 0 100vmax #0000005c}
  main{padding:22px 0 70px}
  .brand{margin-right:0}
}
@media (max-width:620px){
  .top-in{gap:6px 10px}
  .btn.only-m{padding:6px 10px;font-size:.85rem}
  .brand{flex:1 1 auto;min-width:0;font-size:.95rem;gap:8px;white-space:nowrap}
  .brand-mark{font-size:.72rem;padding:3px 6px}
  .tabs{order:9;width:100%}
  .tabs a{flex:1;text-align:center}
  .bar{width:48px}
  .pr-h{display:none}
  .pr{grid-template-columns:minmax(0,1fr)}
  .pr .arr{transform:rotate(90deg)}
  .flow{flex-direction:column}
  .flow .arr{transform:rotate(90deg);align-self:flex-start;margin-left:14px}
  .node{flex-basis:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="top" id="top"></header>
<div class="app">
  <aside class="side" id="side">
    <label class="sr" for="search" id="searchL"></label>
    <input id="search" type="search" autocomplete="off">
    <nav id="navlist"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
/* Perguntas 1-10. Esquema: {n, g (módulo), m (método), pt|en: {s, q, why, one, b[blocos], traps[], rc[[pergunta, resposta]]}} */
window.QS = window.QS || [];

/* ============ 1 · Monolito vs microserviços ============ */
window.QS.push({
  n: 1, g: "A", m: "compare",
  pt: {
    s: "Monolito vs microserviços",
    q: "Qual é a diferença entre arquitetura monolítica e arquitetura de microserviços?",

    F: { pt: "Confiabilidade e operação", en: "Reliability & operations" },
    I: { pt: "roadmap.sh · Iniciante", en: "roadmap.sh · Beginner" },
    M: { pt: "roadmap.sh · Intermediário", en: "roadmap.sh · Intermediate" },
    V: { pt: "roadmap.sh · Avançado", en: "roadmap.sh · Advanced" }
  };
  var MOD_KEYS = ["A", "B", "C", "D", "E", "F"];
  var RM_KEYS = ["I", "M", "V"];
  var ALL_KEYS = MOD_KEYS.concat(RM_KEYS);

  var METHODS = {
    feynman: {
      pt: { name: "Feynman", tag: "Explique para um iniciante usando uma analogia e depois procure onde a analogia falha. Se não consegue simplificar, ainda não entendeu.", flow: "analogia → mecanismo real → onde quebra", use: "Conceitos abstratos que precisam virar intuição." },
      en: { name: "Feynman", tag: "Explain it to a beginner with an analogy, then look for where the analogy fails. If you cannot simplify it, you have not understood it yet.", flow: "analogy → real mechanism → where it breaks", use: "Abstract concepts that must become intuition." }
    },
    whys: {
      pt: { name: "5 Porquês", tag: "Pergunte “por quê?” em cadeia até a causa-raiz. O conceito deixa de ser decoreba e passa a ser consequência.", flow: "por quê? → porque… → por quê? → causa-raiz", use: "Perguntas “por que importa” ou “por que acontece”." },
      en: { name: "5 Whys", tag: "Ask “why?” in a chain until you hit the root cause. The concept stops being memorized and becomes a consequence.", flow: "why? → because… → why? → root cause", use: "“Why does it matter” or “why does it happen” questions." }
    },
    compare: {
      pt: { name: "Comparar e decidir", tag: "Matriz lado a lado mais uma regra de decisão: quando escolher cada lado e quais armadilhas aparecem.", flow: "matriz → regra de decisão → armadilhas", use: "Perguntas “X vs Y”." },
      en: { name: "Compare & decide", tag: "A side-by-side matrix plus a decision rule: when to choose each side and which traps show up.", flow: "matrix → decision rule → traps", use: "“X vs Y” questions." }
    },
    trace: {
      pt: { name: "Rastreio passo a passo", tag: "Siga um único pedido, evento ou transação pelo sistema, incluindo o caminho em que algo dá errado.", flow: "entrada → passo 1 → passo 2 → … → falha", use: "Fluxos com vários atores (eventos, CORS, sagas)." },
      en: { name: "Step-by-step trace", tag: "Follow one request, event or transaction through the system, including the path where something goes wrong.", flow: "input → step 1 → step 2 → … → failure", use: "Flows with several actors (events, CORS, sagas)." }
    },
    playbook: {
      pt: { name: "Playbook", tag: "Sequência acionável de passos, na ordem em que você executaria no trabalho, com o sinal de cada etapa.", flow: "medir → isolar → corrigir → verificar", use: "Perguntas “como você faz / depura / lida com…”." },
      en: { name: "Playbook", tag: "An actionable sequence of steps, in the order you would run them on the job, with the signal for each stage.", flow: "measure → isolate → fix → verify", use: "“How do you do / debug / handle…” questions." }
    },
    threat: {
      pt: { name: "Ameaça → defesa", tag: "Entenda primeiro o ataque (como a falha acontece) e então a contramedida que quebra a causa.", flow: "ataque → causa → defesa", use: "Segurança." },
      en: { name: "Threat → defense", tag: "Understand the attack first (how the flaw happens), then the countermeasure that breaks its cause.", flow: "attack → cause → defense", use: "Security." }
    },
    firstprinciples: {
      pt: { name: "Construir do zero", tag: "Comece pela versão mais simples, acrescente uma restrição por vez e veja o que quebra. Cada conserto vira um componente.", flow: "simples → restrição → quebra → componente", use: "“Como você projetaria / escalaria…”." },
      en: { name: "Build from scratch", tag: "Start from the simplest version, add one constraint at a time and see what breaks. Each fix becomes a component.", flow: "simple → constraint → breakage → component", use: "“How would you design / scale…” questions." }
    },
    design: {
      pt: { name: "Framework de design", tag: "Roteiro fixo de system design: requisitos, estimativas, API, dados, arquitetura e gargalos.", flow: "requisitos → números → API → dados → arquitetura → gargalos", use: "Desenhar um produto completo." },
      en: { name: "Design framework", tag: "A fixed system-design script: requirements, estimates, API, data, architecture and bottlenecks.", flow: "requirements → numbers → API → data → architecture → bottlenecks", use: "Designing a whole product." }
    }
  };
  var METHOD_ORDER = ["feynman", "whys", "compare", "trace", "playbook", "threat", "firstprinciples", "design"];

  function chip(m) { return '<span class="chip mk-' + m + '"><i></i>' + esc(METHODS[m][lang].name) + "</span>"; }

  /* ---------- blocos ---------- */
  function ttl(h) { return h ? "<h4>" + fmt(h) + "</h4>" : ""; }
  var R = {
    an: function (b, t) {
      return '<div class="an"><div class="simple"><span class="lbl">' + t.anSimple + "</span>" + fmt(b.s) + '</div><div><span class="lbl">' + t.anTech + "</span>" + fmt(b.k) + '</div><div class="break"><span class="lbl">' + t.anBreak + "</span>" + fmt(b.b) + "</div></div>";
    },
    why: function (b, t) {
      var h = '<ol class="whys">';
      b.rows.forEach(function (r, i) { h += '<li><span class="w-n">' + (i + 1) + '</span><div class="w-q">' + fmt(r[0]) + '</div><div class="w-a">' + fmt(r[1]) + "</div></li>"; });
      h += "</ol>";
      if (b.root) h += '<div class="root"><span class="lbl">' + t.root + "</span>" + fmt(b.root) + "</div>";
      return h;
    },
    tb: function (b) {
      var h = ttl(b.ti) + '<div class="tbw"><table><thead><tr>';
      b.h.forEach(function (c) { h += "<th>" + fmt(c) + "</th>"; });
      h += "</tr></thead><tbody>";
      b.r.forEach(function (r) {
        h += "<tr>";
        r.forEach(function (c, i) { h += (i === 0 ? '<th scope="row">' : "<td>") + fmt(c) + (i === 0 ? "</th>" : "</td>"); });
        h += "</tr>";
      });
      h += "</tbody></table></div>";
      if (b.n) h += '<p class="note">' + fmt(b.n) + "</p>";
      return h;
    },
    st: function (b) {
      var h = ttl(b.ti) + '<ol class="steps">';
      b.i.forEach(function (s, i) { h += '<li><span class="s-n">' + (i + 1) + "</span><div><strong>" + fmt(s[0]) + "</strong><p>" + fmt(s[1]) + "</p></div></li>"; });
      return h + "</ol>";
    },
    fl: function (b) {
      var h = ttl(b.ti) + '<div class="flow">';
      b.n.forEach(function (n, i) { h += (i ? '<span class="arr" aria-hidden="true">→</span>' : "") + '<div class="node">' + fmt(n) + "</div>"; });
      h += "</div>";
      if (b.c) h += '<p class="note">' + fmt(b.c) + "</p>";
      return h;
    },
    pr: function (b) {
      var h = ttl(b.ti) + '<div class="pairs"><div class="pr-h"><span>' + fmt(b.a) + "</span><span></span><span>" + fmt(b.b) + "</span></div>";
      b.r.forEach(function (r) { h += '<div class="pr"><div class="pr-a">' + fmt(r[0]) + '</div><span class="arr" aria-hidden="true">→</span><div class="pr-b">' + fmt(r[1]) + "</div></div>"; });
      return h + "</div>";
    },
    cd: function (b) {
      return ttl(b.ti) + '<figure class="code" style="margin-left:0;margin-right:0"><figcaption>' + esc(b.l || "code") + "</figcaption><pre><code>" + esc(b.c) + "</code></pre>" + (b.n ? '<p class="note">' + fmt(b.n) + "</p>" : "") + "</figure>";
    },
    tp: function (b) {
      return '<aside class="tp tp-' + (b.k || "tip") + '">' + (b.h ? "<strong>" + fmt(b.h) + "</strong>" : "") + "<p>" + fmt(b.x) + "</p></aside>";
    }
  };

  /* ---------- views ---------- */
  function viewQ(q) {
    var t = T[lang], src = q.alias ? byN(q.alias) : q, d = src[lang], idx = QS.indexOf(q), prev = QS[idx - 1], next = QS[idx + 1], ck = canon(q);
    var eb = lbl(q.n) + " · " + (isOrig(q.g) ? t.module + " " + q.g + " — " : "") + MODS[q.g][lang];
    var h = '<article class="q"><header class="q-head"><p class="eyebrow">' + esc(eb) + "</p><h1>" + esc(q[lang].q) + "</h1>";
    h += '<div class="mrow">' + chip(q.m) + '<p><strong>' + t.whyM + ".</strong> " + fmt(d.why) + "</p></div>";
    if (q.alias) h += '<aside class="tp tp-key" style="margin-top:14px"><strong>' + t.sameAs + " " + lbl(q.alias) + "</strong><p>" + esc(t.sameAsP.replace("{q}", lbl(q.alias) + " (" + src[lang].s + ")")) + "</p></aside>";
    h += "</header>";
    h += '<section class="one" aria-label="' + t.oneLine + '"><span class="lbl">' + t.oneLine + "</span><p>" + fmt(d.one) + "</p></section>";
    h += '<section class="qs">';
    d.b.forEach(function (b) { h += '<div class="blk">' + R[b.t](b, t) + "</div>"; });
    h += "</section>";
    if (d.traps && d.traps.length) {
      h += '<section class="qs"><h2>' + t.traps + '</h2><ul class="traps">';
      d.traps.forEach(function (x) { h += "<li>" + fmt(x) + "</li>"; });
      h += "</ul></section>";
    }
    if (d.rc && d.rc.length) {
      h += '<section class="qs"><h2>' + t.recall + "</h2>";
      d.rc.forEach(function (r) { h += '<details class="rc"><summary>' + fmt(r[0]) + "</summary><p>" + fmt(r[1]) + "</p></details>"; });
      h += "</section>";
    }
    h += '<section class="qs"><div class="teach"><h2 style="font-size:1.1rem;margin-bottom:6px">' + t.teach + "</h2><p>" + t.teachP + "</p></div></section>";
    h += '<nav class="pn">' + (prev ? '<a class="btn" href="#q' + prev.n + '" data-go="q' + prev.n + '">← ' + t.prev + " · " + lbl(prev.n) + "</a>" : "<span></span>");
    h += '<button class="btn' + (prog[ck] === "done" ? " good" : "") + '" id="mark" data-mark="' + ck + '">' + (prog[ck] === "done" ? t.isDone : t.markDone) + "</button>";
    h += next ? '<a class="btn primary" href="#q' + next.n + '" data-go="q' + next.n + '">' + t.next + " · " + lbl(next.n) + " →</a>" : "<span></span>";
    return h + "</nav></article>";
  }

  function viewHome() {
    var t = T[lang];
    var h = '<section class="hero"><p class="eyebrow">' + t.heroEy.replace("{n}", QS.length) + "</p><h1>" + t.heroT + '</h1><p class="lead">' + t.heroP + '</p><p class="note">' + TOTAL + " " + t.uniq + "</p>";
    h += '<div class="cta"><a class="btn primary" href="#q1" data-go="q1">' + t.start + '</a><a class="btn" href="#drill" data-go="drill">' + t.drillCta + "</a></div></section>";
    h += '<section class="sec"><h2>' + t.how + '</h2><ol class="how">';
    [[t.h1, t.h1p], [t.h2, t.h2p], [t.h3, t.h3p], [t.h4, t.h4p]].forEach(function (s) { h += "<li><strong>" + s[0] + "</strong><span>" + s[1] + "</span></li>"; });
    h += "</ol></section>";
    h += '<section class="sec"><h2>' + t.methods + '</h2><div class="mgrid">';
    METHOD_ORDER.forEach(function (m) {
      var M = METHODS[m][lang];
      h += '<div class="mcard mk-' + m + '"><h3>' + chip(m) + "</h3><p>" + esc(M.tag) + '</p><div class="flow-s">' + esc(M.flow) + "</div><p><strong>" + t.bestFor + ":</strong> " + esc(M.use) + '</p><div class="qn">';
      UNIQUE.forEach(function (q) { if (q.m === m) h += '<a href="#q' + q.n + '" data-go="q' + q.n + '" title="' + esc(q[lang].s) + '">' + lbl(q.n) + "</a>"; });
      h += "</div></div>";
    });
    h += "</div></section>";
    function grupo(keys) {
      var o = "";
      keys.forEach(function (g) {
        o += '<div class="mod"><h3><span>' + (isOrig(g) ? g : "R") + "</span>" + esc(MODS[g][lang]) + '</h3><div class="qgrid">';
        QS.forEach(function (q) {
          if (q.g !== g) return;
          var ck = canon(q), dn = prog[ck] === "done";
          o += '<a class="qc' + (dn ? " done" : "") + '" href="#q' + q.n + '" data-go="q' + q.n + '"><div class="top2"><span class="num">' + lbl(q.n) + (q.alias ? " = " + lbl(q.alias) : "") + (dn ? " ✓" : "") + "</span>" + chip(q.m) + "</div><b>" + esc(q[lang].s) + "</b></a>";
        });
        o += "</div></div>";
      });
      return o;
    }
    h += '<section class="sec"><h2>' + t.all + "</h2>" + grupo(MOD_KEYS) + "</section>";
    h += '<section class="sec"><h2>' + t.rm + '</h2><p class="lead" style="font-size:1rem">' + esc(t.rmP) + ' <a href="https://roadmap.sh/questions/backend" target="_blank" rel="noopener noreferrer">' + t.src + " ↗</a></p>" + grupo(RM_KEYS) + "</section>";
    return h;
  }

  function viewCheat() {
    var t = T[lang];
    var h = '<div class="q"><p class="eyebrow">' + t.cheat + '</p><h1 style="font-size:clamp(1.55rem,3.4vw,2.2rem);margin:8px 0 8px">' + t.cheatT + '</h1><p class="lead" style="margin-bottom:8px">' + t.cheatP + "</p>";
    ALL_KEYS.forEach(function (g) {
      h += '<div class="mod"><h3><span>' + (isOrig(g) ? g : "R") + "</span>" + esc(MODS[g][lang]) + '</h3><div class="cs">';
      QS.forEach(function (q) {
        if (q.g !== g) return;
        var src = q.alias ? byN(q.alias) : q;
        h += '<div class="cs-i"><span class="num">' + lbl(q.n) + '</span><div class="hd"><a href="#q' + q.n + '" data-go="q' + q.n + '">' + esc(q[lang].s) + "</a>" + (q.alias ? '<span class="note" style="margin:0">= ' + lbl(q.alias) + "</span>" : "") + chip(q.m) + "</div><p>" + fmt(src[lang].one) + "</p></div>";
      });
      h += "</div></div>";
    });
    return h + "</div>";
  }

  function pickDrill() {
    var pool = UNIQUE.filter(function (q) { return prog[q.n] !== "done" && q.n !== drill.n; });
    if (!pool.length) pool = UNIQUE.filter(function (q) { return prog[q.n] !== "done"; });
    if (!pool.length) { drill.n = null; return; }
    var rev = pool.filter(function (q) { return prog[q.n] === "review"; });
    var src = rev.length && Math.random() < 0.6 ? rev : pool;
    drill.n = src[Math.floor(Math.random() * src.length)].n;
    drill.open = false;
  }

  function viewDrill() {
    var t = T[lang];
    if (drill.n === null || !byN(drill.n) || prog[drill.n] === "done") pickDrill();
    var h = '<div class="drill"><p class="eyebrow">' + t.drill + '</p><h1 style="font-size:clamp(1.55rem,3.4vw,2.2rem);margin:8px 0 8px">' + t.drillT + '</h1><p class="lead">' + t.drillP + "</p>";
    if (drill.n === null) {
      h += '<div class="empty card" style="margin-top:16px"><p>' + t.empty + '</p><div class="acts"><button class="btn" data-act="reset">' + t.reset + "</button></div></div>";
      return h + "</div>";
    }
    var q = byN(drill.n), d = q[lang], left = TOTAL - doneCount();
    h += '<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="eyebrow">' + lbl(q.n) + " · " + left + " " + t.left + "</span>" + chip(q.m) + "</div><h2>" + esc(d.q) + "</h2>";
    if (!drill.open) {
      h += '<div class="acts"><button class="btn primary" data-act="reveal">' + t.reveal + "</button></div>";
    } else {
      h += '<div class="ans"><div class="one" style="margin-top:0"><span class="lbl">' + t.oneLine + "</span><p>" + fmt(d.one) + "</p></div>";
      (d.rc || []).forEach(function (r) { h += '<details class="rc" open><summary>' + fmt(r[0]) + "</summary><p>" + fmt(r[1]) + "</p></details>"; });
      h += '</div><div class="acts"><button class="btn good" data-act="knew">' + t.knew + '</button><button class="btn" data-act="rev">' + t.rev + '</button><a class="btn" href="#q' + q.n + '" data-go="q' + q.n + '">' + t.openFull + "</a></div>";
    }
    return h + "</div></div>";
  }

  /* ---------- chrome ---------- */
  function renderTop() {
    var t = T[lang], dn = doneCount(), pct = TOTAL ? Math.round((dn / TOTAL) * 100) : 0;
    function tab(v, label) { return '<a href="#' + v + '" data-go="' + v + '"' + (view === v ? ' aria-current="page"' : "") + ">" + label + "</a>"; }
    var h = '<div class="top-in"><button class="btn only-m" id="idx" aria-expanded="false" aria-controls="side">☰ ' + t.index + "</button>";
    h += '<a class="brand" href="#home" data-go="home"><span class="brand-mark" aria-hidden="true">/' + QS.length + '</span><span>' + esc(t.brand) + "</span></a>";
    h += '<nav class="tabs" aria-label="Navigation">' + tab("home", t.home) + tab("cheat", t.cheat) + tab("drill", t.drill) + "</nav>";
    h += '<div class="seg" role="group" aria-label="Language"><button data-lang="pt" aria-pressed="' + (lang === "pt") + '">PT</button><button data-lang="en" aria-pressed="' + (lang === "en") + '">EN</button></div>';
    h += '<div class="prog" title="' + dn + "/" + TOTAL + " " + t.uniq + '"><span>' + dn + "/" + TOTAL + '</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + TOTAL + '" aria-valuenow="' + dn + '"><i style="width:' + pct + '%"></i></div></div></div>';
    $("top").innerHTML = h;
    syncHeader();
  }

  function syncHeader() {
    var hh = Math.round($("top").getBoundingClientRect().height);
    if (hh && hh < 200) document.documentElement.style.setProperty("--hh", hh + "px");
  }

  function renderSide() {
    var t = T[lang];
    $("search").placeholder = t.search;
    $("searchL").textContent = t.search;
    var h = "", cur = view.charAt(0) === "q" ? view : "";
    ALL_KEYS.forEach(function (g) {
      var items = QS.filter(function (q) {
        if (q.g !== g) return false;
        if (!query) return true;
        return (lbl(q.n) + " " + q[lang].s + " " + q[lang].q).toLowerCase().indexOf(query) > -1;
      });
      if (!items.length) return;
      h += '<p class="grp">' + (isOrig(g) ? g + " · " : "") + esc(MODS[g][lang]) + "</p>";
      items.forEach(function (q) {
        h += '<a class="ni ' + (prog[canon(q)] || "") + '" href="#q' + q.n + '" data-go="q' + q.n + '"' + (cur === "q" + q.n ? ' aria-current="page"' : "") + '><span class="num">' + (q.n < 100 ? p2(q.n) : lbl(q.n)) + "</span><span>" + esc(q[lang].s) + '</span><span class="ck" aria-hidden="true"></span></a>';
      });
    });
    $("navlist").innerHTML = h;
  }

  function renderMain() {
    var h;
    if (view === "cheat") h = viewCheat();
    else if (view === "drill") h = viewDrill();
    else if (view.charAt(0) === "q" && byN(parseInt(view.slice(1), 10))) h = viewQ(byN(parseInt(view.slice(1), 10)));
    else { view = "home"; h = viewHome(); }
    $("main").innerHTML = h;
  }

  function renderAll() { renderTop(); renderSide(); renderMain(); document.documentElement.lang = lang === "pt" ? "pt-BR" : "en"; }

  function closeSide() { $("side").classList.remove("open"); var b = $("idx"); if (b) b.setAttribute("aria-expanded", "false"); }

  function go(v, noScroll) {
    view = v;
    if (v === "drill") { drill.open = false; if (drill.n === null || prog[drill.n] === "done") drill.n = null; }
    renderAll();
    closeSide();
    if (!noScroll) { window.scrollTo(0, 0); }
    try { window.history.replaceState(null, "", "#" + v); } catch (e) {}
  }

  /* ---------- eventos ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-go],[data-lang],[data-mark],[data-act],#idx") : null;
    if (!el) return;
    if (el.hasAttribute("data-go")) { e.preventDefault(); go(el.getAttribute("data-go")); return; }
    if (el.hasAttribute("data-lang")) {
      lang = el.getAttribute("data-lang"); sset("lang", lang);
      var y = window.pageYOffset; renderAll(); window.scrollTo(0, y); return;
    }
    if (el.hasAttribute("data-mark")) {
      var n = parseInt(el.getAttribute("data-mark"), 10);
      if (prog[n] === "done") delete prog[n]; else prog[n] = "done";
      saveProg(); renderTop(); renderSide();
      var t = T[lang], on = prog[n] === "done";
      el.textContent = on ? t.isDone : t.markDone; el.classList.toggle("good", on);
      return;
    }
    if (el.id === "idx") {
      var side = $("side"), open = !side.classList.contains("open");
      side.classList.toggle("open", open); el.setAttribute("aria-expanded", String(open)); return;
    }
    var act = el.getAttribute("data-act");
    if (act === "reveal") { drill.open = true; renderMain(); }
    else if (act === "knew") { prog[drill.n] = "done"; saveProg(); pickDrill(); renderTop(); renderSide(); renderMain(); }
    else if (act === "rev") { prog[drill.n] = "review"; saveProg(); pickDrill(); renderTop(); renderSide(); renderMain(); }
    else if (act === "reset") { prog = {}; saveProg(); drill.n = null; renderTop(); renderSide(); renderMain(); }
  });

  $("search").addEventListener("input", function () { query = this.value.trim().toLowerCase(); renderSide(); });

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.altKey || e.ctrlKey || e.metaKey || view.charAt(0) !== "q") return;
    var cur = byN(parseInt(view.slice(1), 10));
    if (!cur) return;
    var i = QS.indexOf(cur);
    if (e.key === "ArrowRight" && QS[i + 1]) go("q" + QS[i + 1].n);
    else if (e.key === "ArrowLeft" && QS[i - 1]) go("q" + QS[i - 1].n);
  });

  window.addEventListener("resize", syncHeader);
  window.addEventListener("hashchange", function () {
    var v = (location.hash || "").replace("#", "");
    if (v && v !== view) go(v);
  });

  var start = (location.hash || "").replace("#", "");
  view = start || "home";
  renderAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncHeader);
})();

</script>

</body>
</html>
