<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guias de Estudo</title>
<meta name="description" content="Guias de estudo em HTML, sem dependências: abra, estude e acompanhe o progresso no próprio navegador.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --surface-2:#e9edf1; --fg:#14202b; --muted:#566570; --line:#d3dae1;
  --accent:#0b6b6b; --accent-fg:#ffffff; --accent-soft:#d6ecec;
  --r:6px;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0c141b; --surface:#131e27; --surface-2:#1b2935; --fg:#e4edf3; --muted:#9bb0bf; --line:#263643;
    --accent:#4fd1c5; --accent-fg:#06201f; --accent-soft:#12302f;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2{font-family:var(--f-display);line-height:1.18;text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.in{max-width:960px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.mark{font-family:var(--f-mono);font-weight:500;font-size:.78rem;background:var(--accent);color:var(--accent-fg);padding:3px 7px;border-radius:var(--r)}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.12rem;letter-spacing:-.01em}
.wrap{max-width:960px;margin:0 auto;padding:48px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:-.02em}
.lead{margin-top:14px;color:var(--muted);max-width:60ch}
.grid{list-style:none;margin:36px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:10px;height:100%;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit}
.card:hover{border-color:var(--accent)}
.tag{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.card h2{font-size:1.5rem}
.card p{color:var(--muted);font-size:.95rem}
.go{margin-top:auto;padding-top:6px;font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<header class="top"><div class="in"><span class="mark">/guias</span><span class="brand">Guias de Estudo</span></div></header>
<main class="wrap">
  <h1>Guias de estudo</h1>
  <p class="lead">Cada guia é uma página única, sem dependências: abra, estude e acompanhe o progresso no próprio navegador.</p>
  <ul class="grid">
<!--CARDS-->
  </ul>
</main>
</body>
</html>
